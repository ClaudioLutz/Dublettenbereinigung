[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dedupe"
version = "0.1.0"
description = "High-performance duplicate record detection"
authors = [
  { name = "Jules", email = "jules@example.com" },
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.4.0",
    "numpy>=1.21.0",
    "rapidfuzz>=3.0.0",
    "unidecode>=1.3.0",
    "cologne-phonetics>=2.0.0",
    "sqlalchemy>=1.4.0",
    "python-dotenv>=1.0.0",
    "pyodbc>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "duckdb>=0.9.0",
    "splink>=3.9.0",
    "networkx>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dedupe*", "dedupe_splink*"]
namespaces = false
