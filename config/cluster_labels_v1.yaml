# Cluster-to-Tier Mapping Configuration
# Generated from LLM validation results (Story 1.2)
#
# This file maps cluster IDs to tiers for the tier assignment system.
# - Tier 1: Auto-merge (0% false positive rate guaranteed)
# - Tier 2: Manual review (>0% false positive rate)
#
# Update this file when cluster validation results change (e.g., quarterly re-clustering)
# No code changes required - just update the mappings below.

